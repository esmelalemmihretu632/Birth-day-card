<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>መልካም ልደት!</title>
<style>
  :root{
    --pink:#FF3D7F;
    --orange:#FFA33D;
    --yellow:#FFD93D;
    --purple:#8B3DFF;
    --teal:#2DD4BF;
    --cream:#FFF8EE;
    --ink:#2B1B3D;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    font-family:'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,61,127,.35), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(45,212,191,.35), transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,169,61,.35), transparent 45%),
      var(--ink);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .screen{
    display:none;
    position:relative;
    z-index:5;
    width:min(90vw, 480px);
  }
  .screen.active{display:block;}

  /* ---- shared card shell ---- */
  .card{
    position:relative;
    padding:56px 36px 44px;
    background:var(--cream);
    border-radius:28px;
    text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.08);
    animation:popIn .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn{
    0%{transform:scale(.4) rotate(-6deg);opacity:0;}
    100%{transform:scale(1) rotate(0deg);opacity:1;}
  }

  .balloons{
    position:absolute;
    top:-70px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:14px;
  }
  .balloon{
    width:36px;
    height:46px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    position:relative;
    animation:bob 3.2s ease-in-out infinite;
    box-shadow:inset -6px -6px 10px rgba(0,0,0,.15);
  }
  .balloon:nth-child(1){background:var(--pink);animation-delay:0s;}
  .balloon:nth-child(2){background:var(--yellow);animation-delay:.4s; width:42px; height:54px;}
  .balloon:nth-child(3){background:var(--teal);animation-delay:.8s;}
  .balloon::after{
    content:'';
    position:absolute;
    left:50%;
    bottom:-22px;
    width:1px;
    height:22px;
    background:rgba(43,27,61,.4);
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-2deg);}
    50%{transform:translateY(-10px) rotate(2deg);}
  }

  .eyebrow{
    font-size:14px;
    letter-spacing:.5px;
    color:var(--purple);
    font-weight:700;
    margin-top:8px;
  }

  h1{
    font-size:clamp(28px, 6vw, 40px);
    color:var(--ink);
    margin:8px 0 4px;
    font-weight:800;
  }

  h1 span{
    background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .name{
    font-size:clamp(24px, 5vw, 30px);
    font-weight:800;
    color:var(--pink);
    margin-bottom:18px;
  }

  .message{
    font-size:16.5px;
    line-height:1.7;
    color:#4A3A5C;
    max-width:38ch;
    margin:0 auto 26px;
  }

  .signature{
    font-size:14px;
    color:#9A8AAE;
    letter-spacing:.3px;
  }

  /* ---- login form ---- */
  .field{
    text-align:left;
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:700;
    color:var(--purple);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:2px solid #E7DFF2;
    border-radius:12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    outline:none;
    transition:border-color .2s ease;
  }
  .field input:focus{
    border-color:var(--pink);
  }

  .date-row{
    display:flex;
    gap:8px;
  }
  .date-row select{
    flex:1;
    min-width:0;
    padding:12px 8px;
    border:2px solid #E7DFF2;
    border-radius:12px;
    font-size:14.5px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    outline:none;
    transition:border-color .2s ease;
  }
  .date-row select:focus{
    border-color:var(--pink);
  }
  .date-row select.invalid{
    border-color:var(--pink);
  }

  .enter-btn{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,var(--pink),var(--orange));
    color:#fff;
    font-size:16px;
    font-weight:800;
    font-family:inherit;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(255,61,127,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .enter-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(255,61,127,.45);
  }
  .enter-btn:active{
    transform:translateY(0);
  }

  .hint{
    font-size:12.5px;
    color:#B3A6C4;
    text-align:center;
    margin-top:16px;
  }

  .error-msg{
    font-size:13.5px;
    color:var(--pink);
    background:#FFE8EF;
    border:1.5px solid #FFC2D6;
    border-radius:10px;
    padding:10px 12px;
    text-align:center;
    margin-top:14px;
    display:none;
    font-weight:600;
  }
  .error-msg.show{
    display:block;
  }

  .field input.invalid{
    border-color:var(--pink);
  }

  /* ---- cake ---- */
  .cake-wrap{
    margin:6px 0 8px;
    display:flex;
    justify-content:center;
  }
  .cake-btn{
    background:none;
    border:none;
    cursor:pointer;
    font-size:64px;
    line-height:1;
    animation:wiggle 2.4s ease-in-out infinite;
    transition:transform .15s ease;
    padding:0;
  }
  .cake-btn:hover{transform:scale(1.08);}
  .cake-btn:active{transform:scale(.92);}
  .cake-btn.popped{
    animation:none;
    transform:scale(1.3) rotate(15deg);
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }

  .tap-hint{
    font-size:12.5px;
    color:#B3A6C4;
    margin-bottom:18px;
  }

  .banner{
    font-size:0;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:all .4s ease;
    font-weight:800;
    color:var(--pink);
    margin-bottom:0;
  }
  .banner.show{
    font-size:clamp(22px, 5vw, 30px);
    max-height:80px;
    opacity:1;
    margin-bottom:14px;
  }

  /* ---- confetti ---- */
  .confetti{
    position:fixed;
    top:-10%;
    width:10px;
    height:16px;
    opacity:.9;
    border-radius:2px;
    animation:fall linear infinite;
    z-index:2;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(115vh) rotate(540deg);}
  }

  /* burst confetti (from the cake) */
  .burst{
    position:fixed;
    width:9px;
    height:9px;
    border-radius:2px;
    pointer-events:none;
    z-index:20;
    animation:burstFly .9s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes burstFly{
    0%{transform:translate(0,0) scale(1) rotate(0deg); opacity:1;}
    100%{transform:translate(var(--tx), var(--ty)) scale(.4) rotate(var(--rot)); opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
  }
</style>
</head>
<body>

<!-- SCREEN 1: entry -->
<div class="screen active" id="entry-screen">
  <div class="card">
    <div class="balloons">
      <div class="balloon"></div>
      <div class="balloon"></div>
      <div class="balloon"></div>
    </div>

    <div class="eyebrow">🎉 ልዩ ቀን 🎉</div>
    <h1><span>የልደት</span> ካርድ</h1>
    <p class="message">ስምሽን እና የልደት ቀንሽን አስገቢ፣ ካርድሽ ይከፈትልሻል።</p>

    <form id="entry-form">
      <div class="field">
        <label for="visitor-name">ስም</label>
        <input type="text" id="visitor-name" placeholder="ስምዎን ያስገቡ">
      </div>
      <div class="field">
        <label>የልደት ቀን</label>
        <div class="date-row">
          <select id="bd-day">
            <option value="" disabled selected>ቀን</option>
          </select>
          <select id="bd-month">
            <option value="" disabled selected>ወር</option>
          </select>
          <select id="bd-year">
            <option value="" disabled selected>አመት</option>
          </select>
        </div>
      </div>
      <button type="button" id="submit-btn" class="enter-btn">ካርዱን ክፈት 🎁</button>
    </form>

    <p class="error-msg" id="error-msg">የተሳሳተ የልደት ቀን ነው። እባክሽ ትክክለኛውን ቀን አስገቢ።</p>
    <p class="hint">ትክክለኛ ስምና የልደት ቀን ብቻ ወደ ካርዱ ያስገባሉ።</p>
  </div>
</div>

<!-- SCREEN 2: card -->
<div class="screen" id="card-screen">
  <div class="card">
    <div class="balloons">
      <div class="balloon"></div>
      <div class="balloon"></div>
      <div class="balloon"></div>
    </div>

    <div class="eyebrow">🎉 ልዩ ቀን 🎉</div>
    <h1><span>መልካም ልደት</span> ይሁንልሽ!</h1>
    <div class="name" id="display-name">ውድ ጓደኛዬ 💛</div>

    <div class="banner" id="pop-banner">Happy Birthday! 🎂</div>

    <div class="cake-wrap">
      <button class="cake-btn" id="cake-btn" aria-label="ኬክ ይንኩ">🎂</button>
    </div>
    <p class="tap-hint">ኬክ ላይ ተጫን!</p>

    <p class="message">
      ጤና፣ ደስታና ስኬት የተሞላበት አመት ይሁንልሽ።
      ምኞቴ ሁሌም ፈገግታ ከፊትሽ እንዳይጠፋ ነው!
    </p>

    <div class="signature">በፍቅር የተላከ 🎁</div>
  </div>
</div>

<script>
  const colors = ['#FF3D7F','#FFA33D','#FFD93D','#8B3DFF','#2DD4BF'];

  // background falling confetti, always running quietly
  function spawnBackgroundConfetti(count){
    for(let i=0;i<count;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (4 + Math.random()*4) + 's';
      c.style.animationDelay = (Math.random()*5) + 's';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);
    }
  }
  spawnBackgroundConfetti(40);

  // screen switching
  const entryForm = document.getElementById('entry-form');
  const entryScreen = document.getElementById('entry-screen');
  const cardScreen = document.getElementById('card-screen');
  const displayName = document.getElementById('display-name');

  const CORRECT_DAY = '9';
  const CORRECT_MONTH = '9'; // September
  const CORRECT_YEAR = '2000';

  const dayEl = document.getElementById('bd-day');
  const monthEl = document.getElementById('bd-month');
  const yearEl = document.getElementById('bd-year');
  const errorMsg = document.getElementById('error-msg');

  // populate day 1-31
  for(let d=1; d<=31; d++){
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    dayEl.appendChild(opt);
  }

  // populate months
  const monthNames = ['ጃንዩወሪ','ፌብሩወሪ','ማርች','ኤፕሪል','ሜይ','ጁን','ጁላይ','ኦገስት','ሴፕቴምበር','ኦክቶበር','ኖቬምበር','ዲሴምበር'];
  monthNames.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = i + 1;
    opt.textContent = m;
    monthEl.appendChild(opt);
  });

  // populate year (wide range)
  const currentYear = new Date().getFullYear();
  for(let y=currentYear; y>=1950; y--){
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    yearEl.appendChild(opt);
  }

  function clearInvalid(){
    errorMsg.classList.remove('show');
    [dayEl, monthEl, yearEl].forEach(el => el.classList.remove('invalid'));
  }
  [dayEl, monthEl, yearEl].forEach(el => el.addEventListener('change', clearInvalid));

  entryForm.addEventListener('submit', function(e){
    e.preventDefault();
  });

  const submitBtn = document.getElementById('submit-btn');
  submitBtn.addEventListener('click', function(){
    const name = document.getElementById('visitor-name').value.trim() || 'ውድ ጓደኛዬ';

    const isCorrect =
      dayEl.value === CORRECT_DAY &&
      monthEl.value === CORRECT_MONTH &&
      yearEl.value === CORRECT_YEAR;

    if(!isCorrect){
      errorMsg.classList.add('show');
      [dayEl, monthEl, yearEl].forEach(el => el.classList.add('invalid'));
      return;
    }

    clearInvalid();
    displayName.textContent = name + ' 💛';

    getAudioCtx(); // unlock audio on this user gesture so the cake tap can play sound immediately

    entryScreen.classList.remove('active');
    cardScreen.classList.add('active');
  });

  // cake explosion
  const cakeBtn = document.getElementById('cake-btn');
  const popBanner = document.getElementById('pop-banner');
  let exploded = false;

  // --- sound effects (generated in-browser, no external files needed) ---
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playPopSound(){
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // a quick "pop" — short pitch-drop tone
    const pop = ctx.createOscillator();
    const popGain = ctx.createGain();
    pop.type = 'sine';
    pop.frequency.setValueAtTime(700, now);
    pop.frequency.exponentialRampToValueAtTime(120, now + 0.14);
    popGain.gain.setValueAtTime(0.5, now);
    popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    pop.connect(popGain).connect(ctx.destination);
    pop.start(now);
    pop.stop(now + 0.16);

    // a cheerful little ascending arpeggio right after
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const t = now + 0.12 + i * 0.09;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  }

  cakeBtn.addEventListener('click', function(){
    if(exploded) return;
    exploded = true;

    playPopSound();
    cakeBtn.classList.add('popped');
    popBanner.classList.add('show');

    const rect = cakeBtn.getBoundingClientRect();
    const originX = rect.left + rect.width/2;
    const originY = rect.top + rect.height/2;

    const pieces = 70;
    for(let i=0;i<pieces;i++){
      const p = document.createElement('div');
      p.className = 'burst';
      p.style.left = originX + 'px';
      p.style.top = originY + 'px';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];

      const angle = Math.random() * Math.PI * 2;
      const distance = 120 + Math.random()*220;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 60; // bias upward

      p.style.setProperty('--tx', tx + 'px');
      p.style.setProperty('--ty', ty + 'px');
      p.style.setProperty('--rot', (Math.random()*720 - 360) + 'deg');
      p.style.animationDelay = (Math.random()*0.15) + 's';

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1200);
    }

    // allow tapping again after a short pause, for repeat fun
    setTimeout(() => {
      exploded = false;
      cakeBtn.classList.remove('popped');
    }, 1400);
  });
</script>

</body>
</html>
